name: Upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru
    - name: Install dependencies
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
    - name: Validate canonical source and types
      run: |
        set -euo pipefail
        test -f calcit.cirru
        test -f deps.cirru
        test ! -e compact.cirru
        test ! -e package.cirru
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru --check-only \
          --ns app.comp.container --ns app.config --ns app.main \
          --ns app.schema --ns app.updater --summary-only --format json
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'select(.data.workflow.status == "passed" and .diagnostics == []) | {workflow:.data.workflow,diagnostics:.diagnostics}'
    - name: Select frontend CDN path
      id: asset-path
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          prefix="${GITHUB_REPOSITORY}/"
        fi
        base_url="https://cos-sh.tiye.me/${prefix}"
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "VITE_BASE_URL=./" >> "$GITHUB_ENV"
        else
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
        fi
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
    - name: Compile and build frontend
      run: |
        set -euo pipefail
        yarn build
    - name: Save PR frontend preview
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: phlox-workflow-preview
        path: dist
        if-no-files-found: error
        retention-days: 7
    # Enable PR uploads only after protected preview credentials are configured.
    - name: Upload and verify frontend assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}
    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
